# XcodeGen spec. On a Mac (or in CI):  brew install xcodegen && xcodegen generate
name: CurtinaSchools
options:
  bundleIdPrefix: com.magnus
  deploymentTarget:
    iOS: "15.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  CurtinaSchools:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - CurtinaSchools
    entitlements:
      path: CurtinaSchools/CurtinaSchools.entitlements
      properties:
        aps-environment: development
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnus.curtinaschools
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CurtinaSchools/Info.plist
      properties:
        CFBundleDisplayName: Curtina Schools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take a photo to upload to your school portal, such as a profile picture, assignment or document.
        NSMicrophoneUsageDescription: Record audio when a school portal page asks for it, such as a voice note or video call.
        NSPhotoLibraryUsageDescription: Choose a photo from your library to upload to your school portal.
        NSLocationWhenInUseUsageDescription: Share your location with your school portal when a page asks for it, such as marking attendance on campus.
